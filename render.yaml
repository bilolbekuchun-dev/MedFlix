services:
  - type: web
    name: medflix-bot
    runtime: node
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @workspace/api-server run build
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_ADMIN_IDS
        value: "1733531423"
    disk:
      name: medflix-bot-data
      mountPath: /opt/render/project/src/artifacts/api-server/data
      sizeGB: 1